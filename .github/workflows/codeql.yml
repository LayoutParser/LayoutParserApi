name: CodeQL Security Analysis

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# O workflow apenas le o codigo e publica resultados de code scanning.
#
# NOTA (2026-08-13): a analise roda e conclui normalmente ("Running queries" ok), mas o step de
# upload do SARIF falha com "Advanced Security must be enabled for this repository to use code
# scanning." Isso NAO e' bug de permissions/YAML deste workflow -- e' limitacao de plano: GitHub
# Advanced Security (GHAS) e' recurso pago exigido para code scanning em repositorio PRIVADO, e o
# repo esta privado desde 2026-08-12 (mesma classe de limitacao que a perda de branch protection
# nativa, ver .claude/rules/agent-authority.md). Nao mexer em permissions/config aqui tentando
# "consertar" -- so' desbloqueia assinando GHAS ou tornando o repo publico de novo.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # PRs, inclusive de forks, executam exclusivamente em runner hospedado pelo GitHub.
    # Nunca substituir por self-hosted neste workflow de analise de codigo nao confiavel.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - csharp
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configurar .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # C# nao suporta build-mode "none": o CodeQL precisa compilar para extrair o banco de
          # dados. "autobuild" resolve o(s) .csproj/.sln na raiz do checkout (LayoutParserApi.sln
          # cobre a API, mcp/LayoutParserMcp, ai/XslSynth[.Core] e tools/LowCodeRunner via
          # referencia de projeto/solution). "actions" (analise de workflow YAML) continua sem build.
          build-mode: ${{ matrix.language == 'csharp' && 'autobuild' || 'none' }}
          queries: security-extended

      - name: Analisar e publicar resultados
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
